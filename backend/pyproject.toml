[project]
name = "fielded-backend"
version = "0.1.0"
description = "FIELDed backend — customer-to-business service network"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.1.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "faker>=33.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = [
    # FastAPI dependency-injection idiom: `Query(...)`/`Depends(...)` in
    # argument defaults is the framework's documented pattern, not a bug.
    "B008",
    # Line-length enforcement deferred — accumulated long lines in domain
    # services and tests would require broad reformatting with no safety impact.
    "E501",
    # contextlib.suppress style preference — try/except/pass is explicit.
    "SIM105",
    # Ternary style preference — explicit if/else is more readable for sorting.
    "SIM108",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
