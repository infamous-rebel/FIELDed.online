# Cloud Build configuration for FIELDed backend
# Usage: gcloud builds submit --config=cloudbuild.yaml
#
# Non-secret runtime configuration lives in deploy/cloudrun-env.yaml.
# Secrets (APP_SECRET_KEY, JWT_SECRET_KEY, DATABASE_URL) are referenced
# from Google Secret Manager and must exist before deploying.

steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest"
      - "."

  # Push both tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest"

  # Deploy to Cloud Run (public ingress; app-level JWT auth applies)
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "8000"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--allow-unauthenticated"
      - "--env-vars-file"
      - "deploy/cloudrun-env.yaml"
      - "--set-secrets"
      - "APP_SECRET_KEY=APP_SECRET_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest,BRAIN_AI_API_KEY=BRAIN_AI_API_KEY:latest,DISCOVERY_AI_API_KEY=DISCOVERY_AI_API_KEY:latest,CALL_AGENT_AI_API_KEY=CALL_AGENT_AI_API_KEY:latest"

substitutions:
  _SERVICE: fielded-api
  _REGION: us-central1
  _REPOSITORY: fielded

options:
  logging: CLOUD_LOGGING_ONLY
