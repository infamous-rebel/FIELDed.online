# FIELDed test infrastructure
# Usage: docker compose -f docker/docker-compose.test.yml up -d
# Provides an isolated database for running tests.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: fielded-postgres-test
    environment:
      POSTGRES_USER: fielded
      POSTGRES_PASSWORD: fielded
      POSTGRES_DB: fielded_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielded"]
      interval: 3s
      timeout: 3s
      retries: 5
